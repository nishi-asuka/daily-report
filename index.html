<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="個別スケジュール" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="個別スケジュール" />
    <title>個別スケジュール</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <p class="eyebrow">Personal Schedule</p>
            <h1>個別スケジュール</h1>
          </div>
        </header>

        <section class="panel quick-panel" aria-labelledby="quick-title">
          <div class="panel-heading">
            <h2 id="quick-title">メモ入力</h2>
            <button class="icon-button" id="parseMemoButton" type="button" title="メモから抽出">↵</button>
          </div>
          <textarea id="quickMemo" rows="4" placeholder="明日14時 田中さんと打ち合わせ"></textarea>
        </section>

        <section class="panel install-panel" id="installPanel" aria-live="polite">
          <div>
            <h2>携帯アプリ化</h2>
            <p id="installMessage">ホーム画面に追加すると、アプリのように開けます。</p>
          </div>
          <button type="button" id="installButton" class="primary-button hidden">追加</button>
        </section>

        <section class="panel" aria-labelledby="form-title">
          <div class="panel-heading">
            <h2 id="form-title">予定</h2>
            <button class="icon-button danger hidden" id="cancelEditButton" type="button" title="編集をやめる">×</button>
          </div>
          <form id="eventForm" autocomplete="off">
            <input type="hidden" id="eventId" />
            <label>
              <span>件名</span>
              <input id="titleInput" type="text" required maxlength="80" />
            </label>
            <div class="field-row">
              <label>
                <span>日付</span>
                <input id="dateInput" type="date" required />
              </label>
              <label>
                <span>担当者</span>
                <input id="assigneeInput" type="text" required maxlength="40" />
              </label>
            </div>
            <div class="field-row">
              <label>
                <span>カテゴリ</span>
                <select id="categoryInput">
                  <option value="work">業務</option>
                  <option value="meeting">商談/会議</option>
                  <option value="personal">個人</option>
                  <option value="task">TODO</option>
                  <option value="travel">移動</option>
                </select>
              </label>
              <label>
                <span>ステータス</span>
                <select id="statusInput">
                  <option value="scheduled">予定済み</option>
                  <option value="todo">未着手</option>
                  <option value="done">完了</option>
                  <option value="postponed">延期</option>
                  <option value="needs-check">要確認</option>
                </select>
              </label>
            </div>
            <label class="checkbox-line">
              <input id="allDayInput" type="checkbox" />
              <span>終日</span>
            </label>
            <div class="field-row time-row">
              <label>
                <span>開始</span>
                <input id="startInput" type="time" />
              </label>
              <label>
                <span>終了</span>
                <input id="endInput" type="time" />
              </label>
            </div>
            <div class="field-row">
              <label>
                <span>重要度</span>
                <select id="priorityInput">
                  <option value="normal">通常</option>
                  <option value="high">高</option>
                  <option value="low">低</option>
                </select>
              </label>
              <label>
                <span>場所</span>
                <input id="locationInput" type="text" maxlength="80" />
              </label>
            </div>
            <label>
              <span>メモ</span>
              <textarea id="notesInput" rows="3"></textarea>
            </label>
            <p class="warning hidden" id="conflictWarning"></p>
            <button class="primary-button" type="submit">保存</button>
          </form>
        </section>

        <section class="panel actions-panel" aria-labelledby="actions-title">
          <h2 id="actions-title">入出力</h2>
          <div class="action-grid">
            <button type="button" id="exportJsonButton">JSON</button>
            <button type="button" id="exportCsvButton">CSV</button>
            <label class="file-button">
              読込
              <input id="importInput" type="file" accept="application/json,.json" />
            </label>
            <button type="button" id="seedButton">サンプル</button>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <section class="topbar">
          <div>
            <p class="eyebrow" id="todayText"></p>
            <h2 id="monthTitle"></h2>
          </div>
          <div class="toolbar" aria-label="カレンダー操作">
            <button class="icon-button" id="prevMonthButton" type="button" title="前月">‹</button>
            <button id="todayButton" type="button">今日</button>
            <button class="icon-button" id="nextMonthButton" type="button" title="翌月">›</button>
          </div>
        </section>

        <section class="insights" aria-label="概要">
          <article>
            <span>今日</span>
            <strong id="todayCount">0</strong>
          </article>
          <article>
            <span>7日以内</span>
            <strong id="weekCount">0</strong>
          </article>
          <article>
            <span>重要</span>
            <strong id="highCount">0</strong>
          </article>
          <article>
            <span>要確認</span>
            <strong id="checkCount">0</strong>
          </article>
        </section>

        <section class="calendar-wrap" aria-label="月間カレンダー">
          <div class="weekday">月</div>
          <div class="weekday">火</div>
          <div class="weekday">水</div>
          <div class="weekday">木</div>
          <div class="weekday">金</div>
          <div class="weekday">土</div>
          <div class="weekday">日</div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>
      </main>

      <aside class="agenda">
        <section class="panel agenda-panel">
          <div class="panel-heading">
            <h2 id="selectedDateTitle">選択日</h2>
            <button class="icon-button" id="addSelectedButton" type="button" title="選択日に追加">＋</button>
          </div>
          <div id="selectedEvents" class="event-list"></div>
        </section>

        <section class="panel agenda-panel">
          <div class="panel-heading">
            <h2>直近</h2>
            <select id="filterInput" title="表示カテゴリ">
              <option value="all">すべて</option>
              <option value="work">業務</option>
              <option value="meeting">商談/会議</option>
              <option value="personal">個人</option>
              <option value="task">TODO</option>
              <option value="travel">移動</option>
            </select>
          </div>
          <input id="searchInput" type="search" placeholder="件名・担当者・メモで検索" />
          <div id="upcomingEvents" class="event-list"></div>
        </section>
      </aside>
    </div>

    <template id="eventTemplate">
      <article class="event-item">
        <div class="event-main">
          <span class="event-time"></span>
          <strong class="event-title"></strong>
          <span class="event-meta"></span>
        </div>
        <div class="event-actions">
          <button type="button" class="icon-button edit-button" title="編集">✎</button>
          <button type="button" class="icon-button danger delete-button" title="削除">×</button>
        </div>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
